###############################################################################
# Evaluation of HTTP Reverse Proxies over LEO Satellite Constellations
# OMNeT++ 6.0.1 / INET 4.4.0
#
# [General] holds the reference configuration:
#   10 GB LRU cache, 500 concurrent clients, 5 req/s per client, mixed
#   web/video workload, Zipf alpha = 1.0, 100 Mbps satellite link,
#   0.1 % packet loss, 600 s warm-up + 3,600 s measurement, 3 replications.
# ###############################################################################

[General]
network = leoproxy.networks.FloraSatNetwork
description = "Reference configuration"

# ---- simulation execution  ----
sim-time-limit = 4200s          # 600 s warm-up + 3,600 s measurement window
warmup-period = 600s            # statistics recorded through @statistic ignore the warm-up
repeat = 3                      # three independent replications
seed-set = ${repetition}        # different RNG seeds per replication
cmdenv-express-mode = true
cmdenv-status-frequency = 60s
**.cmdenv-log-level = warn

# ---- result recording ----
# Scalars/statistics everywhere; vectors only where a time-series figure
# needs them (enabled per config). First matching line wins.
*.forwardProxy*.app[0].originRequests.statistic-recording = true
*.forwardProxy*.app[0].upstreamConnections.statistic-recording = true
*.forwardProxy*.app[0].*.statistic-recording = false
**.tcp.**.statistic-recording = false
**.ppp.**.statistic-recording = false
**.ipv4.**.statistic-recording = false
**.vector-recording = false
**.scalar-recording = true
**.bin-recording = true

# ---- topology ----
# fixed: forwardProxy1-3, terminal1-3, leosat1-3, groundStation1-3, reverseProxy, server1-5
*.numClientGroups = 4
*.enableIsl = false             # bent-pipe relay, no inter-satellite links
*.cacheLocation = "reverseProxy"

# ---- scenario and load ----
*.scenario = "land"             # "land" | "remote"
*.numClients = 500              # 10, 50, 100, 200, 500 concurrent clients
**.clientGroup*.app[0].requestRate = 5          # 1, 5, 10 requests/s per client
**.clientGroup*.app[0].trafficType = "mixed"    # "web" | "video" | "mixed" (70/30)
**.clientGroup*.app[0].mixedWebFraction = 0.7
**.clientGroup*.app[0].videoMode = "irm"        # IRM/Poisson requests
**.clientGroup*.app[0].maxConnectionsPerUser = 6
**.clientGroup*.app[0].maxQueuedRequestsPerUser = 32
**.clientGroup*.app[0].startTime = uniform(0.1s, 1s)

# ---- content catalogue and popularity  ----
*.popularity.model = "stationary"
*.popularity.alpha = 1.0                         # 0.3 | 1.0 | 1.2
*.popularity.webCatalogSize = 10000
*.popularity.videoCatalogSize = 1000
**.segmentsPerTitle = 300
**.segmentDuration = 4s
**.videoSegmentSizes = "1MB 3MB 6MB 9MB"         # 240p 480p 720p 1080p
*.server*.app[0].webSizeMedian = 15kB
*.server*.app[0].webSizeSigma = 2.45
*.server*.app[0].webSizeMax = 10MB
*.server*.app[0].webMaxAge = 86400s
*.server*.app[0].videoMaxAge = 3600s
*.server*.app[0].serviceTime = 1ms

# ---- reverse proxy cache  ----
*.cacheSize = 10GB            # 0GB (= no-cache baseline), 1GB, 5GB, 10GB
*.cachePolicy = "LRU"         # LRU | LFU | FIFO | Random | DTLRU
*.reverseProxy.app[0].maxCacheableObjectSize = 100MB
*.reverseProxy.app[0].honorExpiry = false
*.reverseProxy.cacheLookupDelay = 0.5ms
*.reverseProxy.processingDelay = 0.2ms
*.reverseProxy.connectionPoolSize = 0             # connections per origin, 0 = unlimited
*.reverseProxy.app[0].statsInterval = 10s

# ---- satellite link  ----
*.satLinkCapacity = 100Mbps     # 50 | 100 | 200 Mbps raw
*.fecOverhead = 0.10
*.satLossRate = 0.001           # 0 | 0.001 | 0.01 (Gilbert-Elliott mean)
*.satBurstLength = 4            # mean burst 3-5 packets
*.satQueuePackets = 1000      # ~120 ms at 100 Mbps
*.satLinkController[*].altitude = 550km
*.satLinkController[*].userMaxElevation = 85deg
*.satLinkController[*].feederMaxElevation = 85deg
*.satLinkController[*].handoverEnabled = true
*.satLinkController[*].handoverInterval = max(60s, normal(360s, 30s))
*.satLinkController[*].handoverOutage = 100ms

# ---- TCP (INET 4.4) ----
**.tcp.typename = "Tcp"
**.tcp.tcpAlgorithmClass = "TcpNewReno"
**.tcp.mss = 1460
**.tcp.windowScalingSupport = true
**.tcp.advertisedWindow = 1048576     # 1 MiB receive window (>= BDP of 200 Mbps x 40 ms)
**.tcp.timestampSupport = true
**.tcp.increasedIWEnabled = true
**.tcp.sackSupport = false
**.tcp.nagleEnabled = false
**.tcp.delayedAcksEnabled = false


###############################################################################
# Reference points
###############################################################################

[Config Reference_NoCache]
description = "Baseline: pass-through reverse proxy, caching disabled (0 GB)"
*.cacheSize = 0GB

[Config Reference_LRU_10GB]
description = "Default caching configuration (10 GB LRU)"


###############################################################################
# Web and video caching experiments
###############################################################################

# Response time vs concurrent flows (video and web),
# land/remote, no-cache vs LRU 1/5/10 GB and LFU/FIFO/Random 10 GB.
# Also used for throughput vs flows and the hit-ratio/latency scatter.
[Config LatencyVsFlows]
description = "latency & throughput vs concurrent flows"
*.scenario = ${scenario="land","remote"}
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
*.numClients = ${clients=10,50,100,200,500}
*.cachePolicy = ${policy="LRU","LFU","FIFO","Random"}
*.cacheSize = ${cacheGB=0,1,5,10}GB
constraint = ($cacheGB == 0 && $policy == "LRU") || ($cacheGB > 0 && ($policy == "LRU" || $cacheGB == 10))

# Hit ratio vs cache size per policy and alpha, policy comparison at
# alpha = 1.0, latency vs hit ratio, alpha x cache-size interaction.
[Config HitRatioVsCacheSize]
description = "hit ratio vs cache size, policy and Zipf alpha"
*.scenario = ${scenario="land","remote"}
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
*.popularity.alpha = ${alpha=0.3,1.0,1.2}
*.cachePolicy = ${policy="LRU","LFU","FIFO","Random"}
*.cacheSize = ${cacheGB=0,1,5,10}GB
constraint = ($cacheGB > 0) || ($policy == "LRU")

# Satellite link utilisation (remote and land) vs
# concurrent flows for 50/100/200 Mbps, no-cache vs the four policies (10 GB).
[Config UtilizationVsFlows]
description = "satellite link utilisation vs concurrent flows and link capacity"
*.scenario = ${scenario="land","remote"}
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
*.satLinkCapacity = ${capacityMbps=50,100,200}Mbps
*.numClients = ${clients=10,50,100,200,500}
*.cachePolicy = ${policy="LRU","LFU","FIFO","Random"}
*.cacheSize = ${cacheGB=0,10}GB
constraint = ($cacheGB == 10) || ($policy == "LRU")

# Utilisation vs cache size per link capacity, bandwidth savings vs
# cache size and redundant traffic ratio vs cache size; remote-area
# scenario, 500 clients.
[Config LinkCapacityVsCacheSize]
description = "link capacity x cache size x policy (remote)"
*.scenario = "remote"
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
*.satLinkCapacity = ${capacityMbps=50,100,200}Mbps
*.cachePolicy = ${policy="LRU","LFU","FIFO","Random"}
*.cacheSize = ${cacheGB=0,1,5,10}GB
constraint = ($cacheGB > 0) || ($policy == "LRU")

# Effect of the per-client request rate.
[Config RequestRate]
description = "request rate 1/5/10 req/s, no-cache vs LRU 10 GB"
*.scenario = ${scenario="land","remote"}
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
**.clientGroup*.app[0].requestRate = ${rate=1,5,10}
*.cacheSize = ${cacheGB=0,10}GB

# Packet loss vs concurrent flows (web and video) for
# the three channel loss levels; loss x caching interaction.
[Config PacketLossVsFlows]
description = "packet loss vs flows for 0/0.1/1 % channel loss"
*.scenario = ${scenario="land","remote"}
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
*.satLossRate = ${loss=0,0.001,0.01}
*.numClients = ${clients=10,50,100,200,500}
*.cacheSize = ${cacheGB=0,10}GB

# Throughput over time (land and remote).
[Config ThroughputOverTime]
description = "throughput vs time, no-cache vs four policies"
*.scenario = ${scenario="land","remote"}
*.cachePolicy = ${policy="LRU","LFU","FIFO","Random"}
*.cacheSize = ${cacheGB=0,10}GB
constraint = ($cacheGB == 10) || ($policy == "LRU")
**.groupThroughput:vector.vector-recording = true
**.throughputPerUser:vector.vector-recording = true
**.meanResponseTimeWindow:vector.vector-recording = true
**.satDownlinkThroughput:vector.vector-recording = true
**.satDownlinkUtilization:vector.vector-recording = true
**.handover:vector.vector-recording = true
**.vector-recording = false


###############################################################################
# DASH adaptive streaming
###############################################################################

# Base of the DASH configs (also runnable on its own: default DASH case,
# baseline ABR). OMNeT++ 6.0.1 has no "abstract" config option.
[Config DASH_Base]
description = "DASH base: DASH players, 500 video clients, 10 GB LRU, 100 Mbps, 0.1 % loss"
**.clientGroup*.app[0].trafficType = "video"
**.clientGroup*.app[0].videoMode = "dash"
**.clientGroup*.app[0].dashMaxBuffer = 60s
**.clientGroup*.app[0].dashStartupBuffer = 8s
**.clientGroup*.app[0].abrWindow = 5
**.clientGroup*.app[0].abrSafetyFactor = 0.8
**.clientGroup*.app[0].abrPanicBuffer = 5s
**.clientGroup*.app[0].maxConnectionsPerUser = 1
*.numClients = 500

# Oscillation frequency, baseline vs cache-aware ABR, alpha 0.3/1.0/1.2.
[Config DASH_CacheAwareABR]
extends = DASH_Base
description = "Quality oscillation, baseline vs cache-aware ABR"
*.scenario = ${scenario="land","remote"}
*.popularity.alpha = ${alpha=0.3,1.0,1.2}
**.clientGroup*.app[0].cacheAwareABR = ${cacheAwareABR=false,true}
**.tracedQualityLevel:vector.vector-recording = true
**.dashOscillation:vector.vector-recording = true
**.vector-recording = false

# Quality level over time and buffer vs time
# (land/remote), no-cache vs caching policies.
[Config DASH_BufferDynamics]
extends = DASH_Base
description = "DASH buffer and quality traces, no-cache vs caching"
*.scenario = ${scenario="land","remote"}
*.cachePolicy = ${policy="LRU","LFU","FIFO","Random"}
*.cacheSize = ${cacheGB=0,10}GB
constraint = ($cacheGB == 10) || ($policy == "LRU")
**.tracedBufferLevel:vector.vector-recording = true
**.tracedQualityLevel:vector.vector-recording = true
**.vector-recording = false


###############################################################################
# Dynamic popularity and DT+LRU
###############################################################################

[Config DynamicPopularity]
description = "Four-phase Zipf popularity, LRU vs DT+LRU"
*.scenario = "remote"
**.clientGroup*.app[0].trafficType = ${traffic="web","video"}
*.popularity.model = "dynamic"
*.popularity.phaseSchedule = "0s:1.0 900s:0.3 1750s:1.2 2650s:1.0"
*.popularity.phaseOffset = 600s          # phases refer to the measurement window after warm-up
*.cacheSize = 10GB
*.cachePolicy = ${policy="LRU","DTLRU"}
*.reverseProxy.app[0].dtCandidatePool = 8
*.reverseProxy.app[0].dtRetrainInterval = 300s
*.reverseProxy.app[0].dtHorizon = 60s
*.reverseProxy.app[0].dtFrequencyWindow = 300s
*.reverseProxy.app[0].dtMaxDepth = 8
*.reverseProxy.app[0].dtAccuracyWindow = 120s
**.meanResponseTimeWindow:vector.vector-recording = true
**.cacheHitRatioWindow:vector.vector-recording = true
**.byteHitRatioWindow:vector.vector-recording = true
**.originThroughput:vector.vector-recording = true
**.satDownlinkThroughput:vector.vector-recording = true
**.dtPredictionAccuracy:vector.vector-recording = true
**.zipfAlpha:vector.vector-recording = true
**.vector-recording = false


###############################################################################
# Additional configurations
###############################################################################

# Handover outage drawn from 50-150 ms instead of the fixed 100 ms.
[Config Sensitivity_HandoverOutage]
description = "Handover outage drawn uniformly from 50-150 ms"
*.satLinkController[*].handoverOutage = uniform(50ms, 150ms)
*.cacheSize = ${cacheGB=0,10}GB

# Additional variant: places a cache in every user-side forward proxy
# (and none at the gateway) so that cache hits do not traverse the satellite.
# Use it to contrast the gateway placement (see README).
[Config Sensitivity_UserSideCache]
description = "Variant: user-side caches in the forward proxies"
*.cacheLocation = "forwardProxy"
*.cacheSize = ${cacheGB=1,5,10}GB
*.cachePolicy = "LRU"
*.forwardProxy*.app[0].*.statistic-recording = true

# Short functional test of the complete model (about 1-3 minutes wall clock).
[Config Smoke]
description = "Quick functional test: 30 clients, 120 s"
sim-time-limit = 120s
warmup-period = 20s
repeat = 1
*.numClients = 30
**.clientGroup*.app[0].requestRate = 1
*.cacheSize = 1GB
*.satLinkController[*].handoverInterval = 40s
*.popularity.phaseOffset = 0s

